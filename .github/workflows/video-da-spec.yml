name: Video da spec

# Quando in video/spec/ arriva un file .json (la scaletta di un video scritta a mano, con Claude), il video si genera qui
# (la voce Azure funziona su GitHub) e parte su Telegram con il foglio di controllo foto, la copertina e la didascalia.
on:
  push:
    branches: [main]
    paths:
      - 'video/spec/*.json'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: video-da-spec
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Genera i video nuovi e invia su Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          for s in video/spec/*.json; do
            [ -e "$s" ] || continue
            n=$(basename "$s" .json)
            if grep -q "\"$n\"" video/inviati.json; then continue; fi
            INPUT_COSA=spec INPUT_URL="$s" python -m video.genera
          done
      - name: Salva i video già inviati
        if: always()
        run: |
          git config user.name "calcio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add video/inviati.json
          git diff --cached --quiet || (git commit -m "video da spec: inviati" && git pull --rebase --autostash -X theirs origin main && git push)
      - name: Avvisa su Telegram se il video non è riuscito
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT: ${{ secrets.CHAT_ID }}
        run: |
          [ -n "$TOKEN" ] && curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" -d chat_id="$CHAT" --data-urlencode "text=⚠️ Il video da spec non è riuscito. Dettagli: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null || true
