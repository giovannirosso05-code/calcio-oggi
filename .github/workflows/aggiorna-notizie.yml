name: Aggiorna Dati Calcio

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiorna-dati-calcio
  cancel-in-progress: true

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests feedparser
      - name: Raccolta notizie
        run: python build_news.py
      - name: Partite e classifiche (ESPN)
        run: python fetch_dati.py
      - name: Salva dati
        run: |
          git config user.name "calcio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/rassegna.json data/rassegna_scartate.json data/partite.json data/classifiche.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "dati: aggiornamento" && git pull --rebase origin main && git push)
