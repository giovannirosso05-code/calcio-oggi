name: Aggiorna Notizie Calcio

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiorna-notizie-calcio
  cancel-in-progress: true

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Esegui raccolta notizie
        run: python build_news.py
      - name: Salva rassegna
        run: |
          git config user.name "calcio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/rassegna.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "dati: aggiornamento rassegna" && git push)
