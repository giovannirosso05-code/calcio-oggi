name: Genera Video Calcio

on:
  workflow_dispatch:
    inputs:
      cosa:
        description: 'Tipo di operazione: notizia-scelta (copertina + video) o copertina'
        required: true
        default: 'notizia-scelta'
      url:
        description: 'Dati notizia (url|titolo|fonte|serie)'
        required: false
        default: ''

jobs:
  crea-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze di sistema (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Installa pacchetti Python
        run: pip install -r requirements.txt

      - name: Esegui generazione video e invio Telegram
        env:
          INPUT_COSA: ${{ github.event.inputs.cosa }}
          INPUT_URL: ${{ github.event.inputs.url }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: python -m video.genera
